<!doctype html>
<!--
  Demo page for README screenshots. Runs the real app with fake sessions instead of
  the Rust backend, so no real session titles end up in the screenshots.
  Used by scripts/screenshots.sh while `pnpm dev` is running.
  ?menu opens a right-click menu, ?color also opens its Color submenu, ?noinbox empties the Inbox,
  ?collapsed collapses the Done column, ?colmenu right-clicks a column header.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Claudeboard demo</title>
    <script>
      const params = new URLSearchParams(location.search)
      const sessions = [
        ["s1", "Add dark mode to settings page", "/Users/me/Code/acme-web", "busy"],
        ["s2", "Fix flaky checkout test", "/Users/me/Code/acme-web", "idle"],
        ["s3", "Migrate auth to passkeys", "/Users/me/Code/acme-api", "busy"],
        ["s4", "Write release notes for 2.4", "/Users/me/Code/acme-docs", "idle"],
        ["s5", "Investigate slow search queries", "/Users/me/Code/acme-api", "idle"],
        ["s6", "Prototype offline sync", "/Users/me/Code/acme-mobile", "busy"],
        ["s7", "Clean up old feature flags", "/Users/me/Code/acme-web", "idle"],
        ["s8", "Explore new onboarding flow", "/Users/me/Code/acme-mobile", "idle"],
        ["s9", "Bump dependencies", "/Users/me/Code/acme-api", "idle"],
      ].map(([id, name, cwd, status]) => ({ id: "local_" + id, name, cwd, status }))

      const board = {
        columns: [
          { id: "inbox", title: "Inbox", cardIds: ["local_s1", "local_s8"] },
          { id: "col_a", title: "In progress", cardIds: ["local_s3", "local_s6", "local_s5"] },
          { id: "col_b", title: "Needs review", cardIds: ["local_s2", "local_s4"] },
          { id: "col_c", title: "Done", cardIds: ["local_s7", "local_s9"] },
        ],
        sessions: Object.fromEntries(sessions.map(({ id, name, cwd }) => [id, { id, name, cwd }])),
        colors: { local_s3: "purple", local_s2: "blue", local_s6: "green", local_s9: "orange" },
        archivedIds: [],
      }
      if (params.has("collapsed")) board.columns[3].isCollapsed = true
      if (params.has("colmenu")) {
        setTimeout(() => {
          const header = document.querySelectorAll("section")[1].querySelector("header")
          const rect = header.getBoundingClientRect()
          const init = { bubbles: true, cancelable: true, clientX: rect.left + 60, clientY: rect.top + 15, button: 2 }
          header.dispatchEvent(new MouseEvent("contextmenu", init))
        }, 800)
      }
      if (params.has("noinbox")) board.columns[3].cardIds.push(...board.columns[0].cardIds.splice(0))

      window.__TAURI_INTERNALS__ = {
        transformCallback: () => 0,
        invoke: async (cmd) => {
          if (cmd === "load_board") return JSON.stringify(board)
          if (cmd === "list_sessions") return sessions
          return null
        },
      }

      if (params.has("menu") || params.has("color")) {
        setTimeout(() => {
          const card = [...document.querySelectorAll("section div")].find((el) => el.textContent === "Migrate auth to passkeys")
          const rect = card.getBoundingClientRect()
          const init = { bubbles: true, cancelable: true, clientX: rect.left + 120, clientY: rect.top + 30, button: 2 }
          card.dispatchEvent(new MouseEvent("contextmenu", init))
          if (params.has("color")) {
            setTimeout(() => {
              const trigger = [...document.querySelectorAll("[role=menuitem]")].find((el) => el.textContent.startsWith("Color"))
              trigger.click()
            }, 300)
          }
        }, 800)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
